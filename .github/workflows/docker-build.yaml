name: Build and Push Custom Docker Image

on:
  push:
    branches:
      - coolify
  schedule:
    # 每週一 02:00 UTC (台灣時間 10:00) 自動檢查官方更新並建置
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Frontend, Binaries and Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: coolify
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream Probo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/getprobo/probo.git || true
          git fetch upstream main

          # Fast-forward fork main to upstream main
          git push origin upstream/main:main || true

          # Merge upstream main into coolify branch
          git merge upstream/main -m "Merge latest upstream changes from getprobo/probo"
          git push origin coolify || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build emails & compile Relay
        run: |
          npm --workspace @probo/emails run build
          chmod +x ./contrib/merge-graphql-schema.sh
          make relay

      - name: Build frontend apps
        run: |
          NODE_ENV=production npm --workspace @probo/console run build
          NODE_ENV=production npm --workspace @probo/compliance-portal run build
          NODE_ENV=production npm --workspace @probo/employee-portal run build

      - name: Generate Go code
        run: |
          go generate ./pkg/server/api/connect/v1
          go generate ./pkg/server/api/mcp/v1
          go generate ./pkg/server/api/console/v1
          go generate ./pkg/server/api/complianceportal/v1

      - name: Compile Linux amd64 Binaries
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "amd64"
        run: |
          mkdir -p linux/amd64
          go build -ldflags "-s -w -X 'main.env=prod'" -o linux/amd64/probod ./cmd/probod/main.go
          go build -ldflags "-s -w" -o linux/amd64/probod-bootstrap ./cmd/probod-bootstrap/main.go

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo_owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            TARGETPLATFORM=linux/amd64
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/probo:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/probo:${{ github.sha }}

      - name: Trigger Coolify Redeploy
        if: env.COOLIFY_WEBHOOK_URL != ''
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          curl -s -X POST "${COOLIFY_WEBHOOK_URL}"
